<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="100%">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ff2a5f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulseCenter {
        0%, 100% { transform: scale(0.9); opacity: 0.75; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      .gem { transform-origin: 600px 18px; animation: pulseCenter 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#divLine)" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="380" cy="18" r="3" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="820" cy="18" r="3" fill="#ff2a5f" filter="url(#glow)"/>
  <g class="gem">
    <polygon points="600,6 612,18 600,30 588,18" fill="#c084fc" filter="url(#glow)"/>
    <polygon points="600,11 607,18 600,25 593,18" fill="#ffffff"/>
  </g>
</svg>
