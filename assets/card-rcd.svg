<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130924"/>
      <stop offset="100%" stop-color="#06040d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="580" height="230" rx="12" fill="url(#bg)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Header -->
  <text x="24" y="32" fill="#d8b4fe" class="mono" font-size="10" font-weight="700" letter-spacing="2">術式順転「蒼」 // LAPSE: WEBRTC P2P REMOTE DESKTOP</text>
  <rect x="440" y="17" width="116" height="22" rx="11" fill="#1e0b36" stroke="#c084fc" stroke-width="1"/>
  <text x="498" y="32" text-anchor="middle" fill="#e9d5ff" class="mono" font-size="9.5" font-weight="700">⚡ P2P WEBRTC</text>

  <!-- Repo Title -->
  <text x="24" y="66" fill="#ffffff" class="sans" font-size="22" font-weight="800">✦ RCD (Prashnaa)</text>
  <text x="225" y="65" fill="#64748b" class="mono" font-size="11">Consent-First Live Desktop Support</text>

  <!-- Description -->
  <text x="24" y="96" fill="#cbd5e1" class="sans" font-size="13">Zero-command, permission-gated remote desktop &amp; live assistance</text>
  <text x="24" y="116" fill="#cbd5e1" class="sans" font-size="13">built on WebRTC (PeerJS P2P) with a native C# Windows helper.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 134)">
    <rect x="0" y="0" width="106" height="24" rx="6" fill="#170a29" stroke="#311654"/>
    <text x="53" y="16" text-anchor="middle" fill="#d8b4fe" class="mono" font-size="10.5">WebRTC P2P</text>

    <rect x="116" y="0" width="96" height="24" rx="6" fill="#170a29" stroke="#311654"/>
    <text x="164" y="16" text-anchor="middle" fill="#d8b4fe" class="mono" font-size="10.5">C# Helper</text>

    <rect x="222" y="0" width="92" height="24" rx="6" fill="#170a29" stroke="#311654"/>
    <text x="268" y="16" text-anchor="middle" fill="#d8b4fe" class="mono" font-size="10.5">PeerJS</text>

    <rect x="324" y="0" width="110" height="24" rx="6" fill="#170a29" stroke="#311654"/>
    <text x="379" y="16" text-anchor="middle" fill="#d8b4fe" class="mono" font-size="10.5">Zero-Command</text>
  </g>

  <!-- Language Breakdown Bar -->
  <g transform="translate(24, 178)">
    <rect x="0" y="0" width="532" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="0" y="0" width="318" height="7" rx="3.5" fill="#facc15"/>
    <rect x="318" y="0" width="98" height="7" fill="#f97316"/>
    <rect x="416" y="0" width="73" height="7" fill="#a855f7"/>
    <rect x="489" y="0" width="43" height="7" rx="3.5" fill="#22c55e"/>

    <circle cx="6" cy="22" r="4" fill="#facc15"/>
    <text x="16" y="26" fill="#94a3b8" class="mono" font-size="10.5">JS 59.8%</text>

    <circle cx="96" cy="22" r="4" fill="#f97316"/>
    <text x="106" y="26" fill="#94a3b8" class="mono" font-size="10.5">HTML 18.5%</text>

    <circle cx="200" cy="22" r="4" fill="#a855f7"/>
    <text x="210" y="26" fill="#94a3b8" class="mono" font-size="10.5">CSS 13.7%</text>

    <circle cx="295" cy="22" r="4" fill="#22c55e"/>
    <text x="305" y="26" fill="#94a3b8" class="mono" font-size="10.5">C# 8.0%</text>

    <text x="532" y="26" text-anchor="end" fill="#d8b4fe" class="mono" font-size="10.5" font-weight="700">OPEN REPOSITORY →</text>
  </g>
</svg>
