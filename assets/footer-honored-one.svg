<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" height="100%">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04050a"/>
      <stop offset="50%" stop-color="#0d0b1e"/>
      <stop offset="100%" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ff2a5f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .cinematic { font-family: 'Cinzel', 'Didot', 'Times New Roman', serif; }
    </style>
  </defs>

  <rect width="1200" height="170" rx="14" fill="url(#footBg)" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="80" y1="2" x2="1120" y2="2" stroke="url(#lineGrad)" stroke-width="2" filter="url(#glow)"/>

  <g text-anchor="middle">
    <text x="600" y="46" fill="#00e5ff" class="mono" font-size="11" letter-spacing="6" filter="url(#glow)">
      領域展開「無量空処」 // END OF TRANSMISSION
    </text>
    <text x="600" y="90" fill="#ffffff" class="cinematic" font-size="28" font-weight="700" letter-spacing="8">
      “PEACE IS ALL I SEEK.”
    </text>
    <text x="600" y="122" fill="#c084fc" class="mono" font-size="11.5" letter-spacing="4">
      天上天下唯我独尊  •  DATHEVINCI (DEJAVU)  •  THE HONORED ONE
    </text>
    <text x="600" y="148" fill="#64748b" class="mono" font-size="10" letter-spacing="2.5">
      CRAFTED IN THE UNLIMITED VOID  //  GITHUB.COM/DATHEVINCI
    </text>
  </g>
</svg>
