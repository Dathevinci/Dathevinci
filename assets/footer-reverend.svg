    <text x="600" y="90" fill="#6ee7c8" class="sans" font-size="13" letter-spacing="5" opacity="0.72">&#26089;&#23681;&#24050;&#30693;&#19990;&#20107;&#33392;&#65292;&#20173;&#35768;&#39134;&#40511;&#33633;&#20113;&#38388;</text>
