      <stop offset="0%" stop-color="#050b0d"/>
      <stop offset="50%" stop-color="#091517"/>
      <stop offset="100%" stop-color="#050b0d"/>
    </linearGradient>
    <linearGradient id="jadeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6ee7c8" stop-opacity="0.45"/>
