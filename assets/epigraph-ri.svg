<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 396" width="600" height="396">
  <defs>
    <clipPath id="epiClip">
      <rect width="600" height="396" rx="14"/>
    </clipPath>
    <radialGradient id="jadeHalo" cx="12%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#13312e" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#071113" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#050b0d" stop-opacity="0.98"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .serif { font-family: 'Georgia', 'Palatino Linotype', 'Times New Roman', serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#epiClip)">
    <image href="data:image/jpeg;base64," x="0" y="0" width="600" height="396" preserveAspectRatio="xMidYMid slice"/>
    <rect width="600" height="396" fill="url(#jadeHalo)"/>

    <g transform="translate(38, 0)">
      <text x="0" y="48" fill="#6ee7c8" class="mono" font-size="13" font-weight="600" letter-spacing="3" opacity="0.92">PERSEVERANCE  &#183;  &#22362;&#25345;  &#183;  CH. 1285</text>

      <text x="0" y="96" fill="#f1f8f7" class="serif" font-size="21" font-style="italic">&#8220;I had once screamed, gradually, I lost my voice.</text>
      <text x="0" y="126" fill="#f1f8f7" class="serif" font-size="21" font-style="italic">I had once cried, gradually, I lost my tears.</text>
      <text x="0" y="156" fill="#d5ebe7" class="serif" font-size="21" font-style="italic">My gaze is as steady as a monolith &#8212;</text>
      <text x="0" y="186" fill="#6ee7c8" class="serif" font-size="21.5" font-style="italic">only perseverance remains in my heart.&#8221;</text>

      <line x1="0" y1="216" x2="524" y2="216" stroke="#9fd8cb" stroke-opacity="0.16" stroke-width="1"/>

      <text x="0" y="252" fill="#e2eeec" class="sans" font-size="17" font-weight="700">Quiet craft, built from first principles.</text>
      <text x="0" y="282" fill="#a8c2bf" class="sans" font-size="15.5">Native browsers without Electron overhead, local-first</text>
      <text x="0" y="306" fill="#a8c2bf" class="sans" font-size="15.5">worldbuilding tools, zero-command P2P support, and</text>
      <text x="0" y="330" fill="#a8c2bf" class="sans" font-size="15.5">restrained audio &#8212; built to endure rather than impress.</text>

      <text x="0" y="368" fill="#7aa09b" class="mono" font-size="12.5" letter-spacing="1.5">5 PROJECTS  &#183;  WINDOWS / ANDROID / WEB</text>
      <text x="524" y="368" text-anchor="end" fill="#89b5ae" class="sans" font-size="13.5" letter-spacing="3.5" opacity="0.8">&#21476;&#26376;&#26041;&#28304;</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="599" height="395" rx="14" fill="none" stroke="#9fd8cb" stroke-opacity="0.18" stroke-width="1"/>
</svg>