<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="580" height="230" rx="12" fill="url(#bg)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Header -->
  <text x="24" y="32" fill="#00e5ff" class="mono" font-size="10" font-weight="700" letter-spacing="2">領域展開 // DOMAIN: WORLDBUILDING &amp; CARTOGRAPHY</text>
  <rect x="448" y="17" width="108" height="22" rx="11" fill="#062038" stroke="#00e5ff" stroke-width="1"/>
  <text x="502" y="32" text-anchor="middle" fill="#7dd3fc" class="mono" font-size="9.5" font-weight="700">● LIVE DEPLOY</text>

  <!-- Repo Title -->
  <text x="24" y="66" fill="#ffffff" class="sans" font-size="22" font-weight="800">✦ Lordspey</text>
  <text x="155" y="65" fill="#64748b" class="mono" font-size="11">dathevinci.github.io/Lordspey</text>

  <!-- Description -->
  <text x="24" y="96" fill="#cbd5e1" class="sans" font-size="13">Minimal Obsidian-inspired author's workspace for manuscript</text>
  <text x="24" y="116" fill="#cbd5e1" class="sans" font-size="13">drafts, interconnected lore, worldbuilding &amp; interactive cartography.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 134)">
    <rect x="0" y="0" width="96" height="24" rx="6" fill="#0b1528" stroke="#1e293b"/>
    <text x="48" y="16" text-anchor="middle" fill="#38bdf8" class="mono" font-size="10.5">JavaScript</text>

    <rect x="106" y="0" width="112" height="24" rx="6" fill="#0b1528" stroke="#1e293b"/>
    <text x="162" y="16" text-anchor="middle" fill="#38bdf8" class="mono" font-size="10.5">Canvas Maps</text>

    <rect x="228" y="0" width="104" height="24" rx="6" fill="#0b1528" stroke="#1e293b"/>
    <text x="280" y="16" text-anchor="middle" fill="#38bdf8" class="mono" font-size="10.5">Knowledge Graph</text>

    <rect x="342" y="0" width="92" height="24" rx="6" fill="#0b1528" stroke="#1e293b"/>
    <text x="388" y="16" text-anchor="middle" fill="#38bdf8" class="mono" font-size="10.5">CSS3 / UI</text>
  </g>

  <!-- Language Breakdown Bar -->
  <g transform="translate(24, 178)">
    <rect x="0" y="0" width="532" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="0" y="0" width="374" height="7" rx="3.5" fill="#facc15"/>
    <rect x="374" y="0" width="80" height="7" fill="#a855f7"/>
    <rect x="454" y="0" width="78" height="7" rx="3.5" fill="#f97316"/>

    <circle cx="6" cy="22" r="4" fill="#facc15"/>
    <text x="16" y="26" fill="#94a3b8" class="mono" font-size="10.5">JavaScript 70.2%</text>

    <circle cx="148" cy="22" r="4" fill="#a855f7"/>
    <text x="158" y="26" fill="#94a3b8" class="mono" font-size="10.5">CSS 15.1%</text>

    <circle cx="248" cy="22" r="4" fill="#f97316"/>
    <text x="258" y="26" fill="#94a3b8" class="mono" font-size="10.5">HTML 14.7%</text>

    <text x="532" y="26" text-anchor="end" fill="#00e5ff" class="mono" font-size="10.5" font-weight="700">OPEN REPOSITORY →</text>
  </g>
</svg>
