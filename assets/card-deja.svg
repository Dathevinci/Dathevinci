<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190714"/>
      <stop offset="100%" stop-color="#08040c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="580" height="230" rx="12" fill="url(#bg)" stroke="#ff2a5f" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Header -->
  <text x="24" y="32" fill="#fb7185" class="mono" font-size="10" font-weight="700" letter-spacing="2">術式反転「赫」 // REVERSAL: BITCHORD AUDIO ENGINE</text>
  <rect x="440" y="17" width="116" height="22" rx="11" fill="#2c0818" stroke="#ff2a5f" stroke-width="1"/>
  <text x="498" y="32" text-anchor="middle" fill="#fda4af" class="mono" font-size="9.5" font-weight="700">♫ NATIVE AUDIO</text>

  <!-- Repo Title -->
  <text x="24" y="66" fill="#ffffff" class="sans" font-size="22" font-weight="800">✦ Deja</text>
  <text x="115" y="65" fill="#64748b" class="mono" font-size="11">Desktop Music Client • Apple Music UI</text>

  <!-- Description -->
  <text x="24" y="96" fill="#cbd5e1" class="sans" font-size="13">Desktop YouTube Music client crafted with Apple Music design</text>
  <text x="24" y="116" fill="#cbd5e1" class="sans" font-size="13">language, synchronized lyrics, and BitChord native audio pipeline.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 134)">
    <rect x="0" y="0" width="108" height="24" rx="6" fill="#210918" stroke="#3f1229"/>
    <text x="54" y="16" text-anchor="middle" fill="#fda4af" class="mono" font-size="10.5">BitChord DSP</text>

    <rect x="118" y="0" width="102" height="24" rx="6" fill="#210918" stroke="#3f1229"/>
    <text x="169" y="16" text-anchor="middle" fill="#fda4af" class="mono" font-size="10.5">Desktop App</text>

    <rect x="230" y="0" width="110" height="24" rx="6" fill="#210918" stroke="#3f1229"/>
    <text x="285" y="16" text-anchor="middle" fill="#fda4af" class="mono" font-size="10.5">Apple Glass UI</text>

    <rect x="350" y="0" width="96" height="24" rx="6" fill="#210918" stroke="#3f1229"/>
    <text x="398" y="16" text-anchor="middle" fill="#fda4af" class="mono" font-size="10.5">JavaScript</text>
  </g>

  <!-- Language Breakdown Bar -->
  <g transform="translate(24, 178)">
    <rect x="0" y="0" width="532" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="0" y="0" width="425" height="7" rx="3.5" fill="#facc15"/>
    <rect x="425" y="0" width="75" height="7" fill="#a855f7"/>
    <rect x="500" y="0" width="32" height="7" rx="3.5" fill="#f97316"/>

    <circle cx="6" cy="22" r="4" fill="#facc15"/>
    <text x="16" y="26" fill="#94a3b8" class="mono" font-size="10.5">JavaScript 79.9%</text>

    <circle cx="148" cy="22" r="4" fill="#a855f7"/>
    <text x="158" y="26" fill="#94a3b8" class="mono" font-size="10.5">CSS 14.1%</text>

    <circle cx="248" cy="22" r="4" fill="#f97316"/>
    <text x="258" y="26" fill="#94a3b8" class="mono" font-size="10.5">HTML 6.0%</text>

    <text x="532" y="26" text-anchor="end" fill="#fb7185" class="mono" font-size="10.5" font-weight="700">OPEN REPOSITORY →</text>
  </g>
</svg>
