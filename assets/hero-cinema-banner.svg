<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Deep Space & Void Gradients -->
    <radialGradient id="voidBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#11152c"/>
      <stop offset="45%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>

    <radialGradient id="purpleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#d8b4fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#4c1d95" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030408" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lapseBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0faff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="reversalRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ff2a5f" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#be123c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="cyanVioletLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ff2a5f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2a5f" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowStrong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .font-cinematic { font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Times New Roman', serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseVoid {
        0%, 100% { transform: scale(0.96); opacity: 0.75; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes orbitBlue {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(28px, -10px) scale(1.08); }
      }
      @keyframes orbitRed {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-28px, 10px) scale(1.08); }
      }
      @keyframes blinkRec {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(-440px); }
        100% { transform: translateY(440px); }
      }
      @keyframes shimmerText {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.55)); }
        50% { opacity: 1; filter: drop-shadow(0 0 22px rgba(192, 132, 252, 0.9)); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -240; }
      }

      .ring-cw { transform-origin: 600px 220px; animation: spinSlow 28s linear infinite; }
      .ring-ccw { transform-origin: 600px 220px; animation: spinReverse 20s linear infinite; }
      .void-core { transform-origin: 600px 220px; animation: pulseVoid 5s ease-in-out infinite; }
      .orb-blue { animation: orbitBlue 6s ease-in-out infinite; }
      .orb-red { animation: orbitRed 6s ease-in-out infinite; }
      .rec-dot { animation: blinkRec 1.4s infinite; }
      .hero-title { animation: shimmerText 4s ease-in-out infinite; }
      .energy-arc { stroke-dasharray: 18 14; animation: dashFlow 4s linear infinite; }
    </style>
  </defs>

  <!-- Base Void Background -->
  <rect width="1200" height="440" rx="14" fill="url(#voidBg)"/>

  <!-- Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
    <line x1="1000" y1="0" x2="1000" y2="440"/>
  </g>

  <!-- Cosmic Starfield / Unlimited Void Particles -->
  <g fill="#ffffff">
    <circle cx="95" cy="88" r="1.2" opacity="0.5"/>
    <circle cx="145" cy="310" r="1.8" fill="#00e5ff" opacity="0.7"/>
    <circle cx="230" cy="140" r="1" opacity="0.4"/>
    <circle cx="310" cy="75" r="1.5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="290" cy="340" r="1.2" opacity="0.5"/>
    <circle cx="450" cy="95" r="2" fill="#c084fc" opacity="0.65"/>
    <circle cx="760" cy="85" r="1.6" fill="#c084fc" opacity="0.65"/>
    <circle cx="880" cy="130" r="1.2" opacity="0.4"/>
    <circle cx="920" cy="335" r="1.8" fill="#ff2a5f" opacity="0.65"/>
    <circle cx="1040" cy="95" r="1.4" fill="#fb7185" opacity="0.6"/>
    <circle cx="1110" cy="295" r="1.2" opacity="0.45"/>
    <circle cx="1075" cy="185" r="1.6" fill="#00e5ff" opacity="0.5"/>
    <circle cx="130" cy="200" r="1.5" fill="#c084fc" opacity="0.5"/>
  </g>

  <!-- Left Energy Singularity: Cursed Technique Lapse: BLUE (蒼) -->
  <g class="orb-blue">
    <circle cx="255" cy="220" r="145" fill="url(#lapseBlue)"/>
    <circle cx="255" cy="220" r="58" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="10 8"/>
    <circle cx="255" cy="220" r="34" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.7" filter="url(#glowSoft)"/>
    <circle cx="255" cy="220" r="10" fill="#e0faff" filter="url(#glowStrong)"/>
    <text x="255" y="302" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="10" letter-spacing="2.5" opacity="0.85">術式順転「蒼」 // LAPSE: BLUE</text>
  </g>

  <!-- Right Energy Singularity: Cursed Technique Reversal: RED (赫) -->
  <g class="orb-red">
    <circle cx="945" cy="220" r="145" fill="url(#reversalRed)"/>
    <circle cx="945" cy="220" r="58" fill="none" stroke="#ff2a5f" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="10 8"/>
    <circle cx="945" cy="220" r="34" fill="none" stroke="#fecdd3" stroke-width="1.5" stroke-opacity="0.7" filter="url(#glowSoft)"/>
    <circle cx="945" cy="220" r="10" fill="#ffe4e6" filter="url(#glowStrong)"/>
    <text x="945" y="302" text-anchor="middle" fill="#fb7185" class="font-mono" font-size="10" letter-spacing="2.5" opacity="0.85">術式反転「赫」 // REVERSAL: RED</text>
  </g>

  <!-- Convergence Energy Streams Toward Center (Hollow Purple) -->
  <path d="M 290 220 Q 440 165 565 220" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-opacity="0.55" class="energy-arc" filter="url(#glowSoft)"/>
  <path d="M 290 220 Q 440 275 565 220" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" class="energy-arc"/>
  <path d="M 910 220 Q 760 165 635 220" fill="none" stroke="#ff2a5f" stroke-width="1.8" stroke-opacity="0.55" class="energy-arc" filter="url(#glowSoft)"/>
  <path d="M 910 220 Q 760 275 635 220" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-opacity="0.4" class="energy-arc"/>

  <!-- Center Unlimited Void / Hollow Purple Event Horizon -->
  <g class="void-core">
    <circle cx="600" cy="220" r="195" fill="url(#purpleCore)"/>
    <!-- Black Hole Event Horizon Core -->
    <circle cx="600" cy="220" r="76" fill="#04050c" stroke="#e9d5ff" stroke-width="1.8" filter="url(#glowStrong)"/>
    <circle cx="600" cy="220" r="82" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.65"/>
  </g>

  <!-- Rotating Six Eyes / Limitless Geometric Rings -->
  <g class="ring-cw">
    <circle cx="600" cy="220" r="118" fill="none" stroke="url(#cyanVioletLine)" stroke-width="1.5" stroke-dasharray="36 18 12 18"/>
    <circle cx="600" cy="220" r="150" fill="none" stroke="#c084fc" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="6 14"/>
  </g>
  <g class="ring-ccw">
    <circle cx="600" cy="220" r="134" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="22 28 8 28"/>
    <polygon points="600,72 612,102 588,102" fill="#00e5ff" opacity="0.45"/>
    <polygon points="600,368 612,338 588,338" fill="#ff2a5f" opacity="0.45"/>
  </g>

  <!-- Central Typography Overlay -->
  <g text-anchor="middle">
    <!-- Japanese Kanji Header -->
    <text x="600" y="120" fill="#00e5ff" class="font-sans" font-size="13" font-weight="600" letter-spacing="9" filter="url(#glowSoft)">
      天 上 天 下 唯 我 独 尊
    </text>

    <!-- Main Cinematic Name -->
    <text x="600" y="210" fill="url(#titleGrad)" class="font-cinematic hero-title" font-size="64" font-weight="700" letter-spacing="14">
      DATHEVINCI
    </text>

    <!-- Thin Anamorphic Flare Line -->
    <rect x="230" y="232" width="740" height="1.8" fill="url(#cyanVioletLine)" filter="url(#glowSoft)"/>
    <circle cx="600" cy="233" r="3.5" fill="#ffffff" filter="url(#glowStrong)"/>

    <!-- Subtitle / Alias & Bio Quote -->
    <text x="600" y="266" fill="#f8fafc" class="font-mono" font-size="14" font-weight="600" letter-spacing="5">
      DEJAVU  •  "PEACE IS ALL I SEEK."
    </text>

    <!-- Honored One Sub-caption -->
    <text x="600" y="296" fill="#94a3b8" class="font-mono" font-size="11" letter-spacing="3.5">
      “THROUGHOUT HEAVEN AND EARTH, I ALONE AM THE HONORED ONE.”
    </text>

    <!-- Technique Pill Badges -->
    <g transform="translate(600, 336)">
      <rect x="-290" y="-14" width="175" height="24" rx="12" fill="#081426" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.7"/>
      <text x="-202" y="2" fill="#7dd3fc" class="font-mono" font-size="10" letter-spacing="1.5">六眼 // SIX EYES</text>

      <rect x="-95" y="-14" width="190" height="24" rx="12" fill="#170b29" stroke="#c084fc" stroke-width="1" stroke-opacity="0.85"/>
      <text x="0" y="2" fill="#e9d5ff" class="font-mono" font-size="10" letter-spacing="1.5">無下限 // LIMITLESS</text>

      <rect x="115" y="-14" width="175" height="24" rx="12" fill="#260814" stroke="#ff2a5f" stroke-width="1" stroke-opacity="0.7"/>
      <text x="202" y="2" fill="#fda4af" class="font-mono" font-size="10" letter-spacing="1.5">虚式「茈」 // PURPLE</text>
    </g>
  </g>

  <!-- 21:9 Cinema Letterbox Top Bar -->
  <rect x="0" y="0" width="1200" height="44" fill="#030408" fill-opacity="0.92"/>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="url(#cyanVioletLine)" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="32" cy="22" r="4.5" fill="#ff2a5f" class="rec-dot" filter="url(#glowSoft)"/>
  <text x="46" y="26" fill="#e2e8f0" class="font-mono" font-size="11" letter-spacing="2">REC // JUJUTSU TECH ARCHIVE — FILE: SATORU-001 [SPECIAL GRADE // 特級]</text>
  <text x="1170" y="26" text-anchor="end" fill="#38bdf8" class="font-mono" font-size="11" letter-spacing="2">CURSED ENERGY OUTPUT: ∞ [MAX]</text>

  <!-- 21:9 Cinema Letterbox Bottom Bar -->
  <rect x="0" y="396" width="1200" height="44" fill="#030408" fill-opacity="0.92"/>
  <line x1="0" y1="396" x2="1200" y2="396" stroke="url(#cyanVioletLine)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="30" y="422" fill="#94a3b8" class="font-mono" font-size="11" letter-spacing="2">領域展開「無量空処」 // DOMAIN EXPANSION: UNLIMITED VOID</text>
  <text x="600" y="422" text-anchor="middle" fill="#c084fc" class="font-mono" font-size="11" letter-spacing="3">◆  ANAMORPHIC 2.39:1 // MAPPA CINEMA GRADE  ◆</text>
  <text x="1170" y="422" text-anchor="end" fill="#94a3b8" class="font-mono" font-size="11" letter-spacing="2">TC 00:24:10:31 // SHIBUYA</text>

  <!-- Outer Cinema Frame Border -->
  <rect x="1" y="1" width="1198" height="438" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>
</svg>
