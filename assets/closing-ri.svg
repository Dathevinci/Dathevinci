    <text x="400" y="122" fill="#6ee7c8" class="sans" font-size="15.5" letter-spacing="4.5" opacity="0.8">&#26089;&#23681;&#24050;&#30693;&#19990;&#20107;&#33392;&#65292;&#20173;&#35768;&#39134;&#40511;&#33633;&#20113;&#38388;</text>
    <text x="400" y="150" fill="#7aa09b" class="mono" font-size="13" letter-spacing="3">DATHEVINCI  &#183;  DEJAVU  &#183;  REVEREND INSANITY</text>
