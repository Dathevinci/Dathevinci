      <rect x="0" y="0" width="152" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="20" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">⚡ JavaScript ES6+</text>

      <rect x="164" y="0" width="154" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="178" y="20" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">🔷 TypeScript 5</text>

      <!-- Row 2 -->
      <rect x="0" y="44" width="152" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="64" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">⚛️ React 19 / Next</text>

      <rect x="164" y="44" width="154" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="178" y="64" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">🌊 Tailwind CSS v4</text>

      <!-- Row 3 -->
      <rect x="0" y="88" width="152" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="108" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">🎞️ Framer Motion</text>

      <rect x="164" y="88" width="154" height="32" rx="6" fill="#061326" stroke="#0284c7" stroke-width="1"/>
      <text x="178" y="108" fill="#e0f2fe" class="mono" font-size="11.5" font-weight="600">🔥 Vite / HTML5</text>
    </g>

    <!-- Output Telemetry Bar -->
