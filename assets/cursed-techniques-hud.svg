  <g transform="translate(808, 66)">
    <rect width="366" height="320" rx="12" fill="url(#purpleCard)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="366" height="4" rx="2" fill="#c084fc" filter="url(#glow)"/>

    <!-- Orb Icon -->
    <circle cx="42" cy="44" r="18" fill="#c084fc" fill-opacity="0.18" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
