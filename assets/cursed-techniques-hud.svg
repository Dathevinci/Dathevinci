    <text x="74" y="39" fill="#fb7185" class="mono" font-size="11" font-weight="700" letter-spacing="2">術式反転「赫」 // REVERSAL: RED</text>
    <text x="74" y="58" fill="#ffffff" class="sans" font-size="16" font-weight="700" letter-spacing="0.5">Backend, Data &amp; Native</text>

