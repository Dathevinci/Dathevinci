      <text x="14" y="20" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">📡 WebRTC / PeerJS</text>

      <rect x="164" y="0" width="154" height="32" rx="6" fill="#160729" stroke="#9333ea" stroke-width="1"/>
      <text x="178" y="20" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">🎵 BitChord Audio</text>

      <!-- Row 2 -->
      <rect x="0" y="44" width="152" height="32" rx="6" fill="#160729" stroke="#9333ea" stroke-width="1"/>
      <text x="14" y="64" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">🎬 HLS Proxy Engine</text>

      <rect x="164" y="44" width="154" height="32" rx="6" fill="#160729" stroke="#9333ea" stroke-width="1"/>
      <text x="178" y="64" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">🗺️ Cartography Graph</text>

      <!-- Row 3 -->
      <rect x="0" y="88" width="152" height="32" rx="6" fill="#160729" stroke="#9333ea" stroke-width="1"/>
      <text x="14" y="108" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">🔮 AniList GraphQL</text>

      <rect x="164" y="88" width="154" height="32" rx="6" fill="#160729" stroke="#9333ea" stroke-width="1"/>
      <text x="178" y="108" fill="#f3e8ff" class="mono" font-size="11.5" font-weight="600">☁️ Vercel / Render</text>
