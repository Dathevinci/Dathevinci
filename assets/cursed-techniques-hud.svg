<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="100%">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#090c1a"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081a2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0818" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d050c" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .cinematic { font-family: 'Cinzel', 'Didot', 'Georgia', serif; }

      @keyframes pulseBar {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @keyframes rotateOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pulse { animation: pulseBar 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="410" rx="14" fill="url(#hudBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Telemetry Header -->
  <rect x="0" y="0" width="1200" height="48" rx="14" fill="#04050b"/>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="30" fill="#38bdf8" class="mono" font-size="12" font-weight="700" letter-spacing="3">◆ CURSED TECHNIQUE ARSENAL // 無下限呪術 LOADOUT</text>
  <text x="1168" y="30" text-anchor="end" fill="#94a3b8" class="mono" font-size="11" letter-spacing="2">SIX EYES ANALYSIS: ACTIVE [六眼]</text>

  <!-- ==================== COLUMN 1: LAPSE BLUE (FRONTEND & UI) ==================== -->
  <g transform="translate(26, 66)">
    <rect width="366" height="320" rx="12" fill="url(#blueCard)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="366" height="4" rx="2" fill="#00e5ff" filter="url(#glow)"/>

    <!-- Orb Icon -->
    <circle cx="42" cy="44" r="18" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="42" cy="44" r="7" fill="#e0faff"/>
    <text x="74" y="39" fill="#00e5ff" class="mono" font-size="11" font-weight="700" letter-spacing="2">術式順転「蒼」 // LAPSE: BLUE</text>
    <text x="74" y="58" fill="#ffffff" class="sans" font-size="16" font-weight="700" letter-spacing="0.5">Frontend &amp; Visual Craft</text>

    <text x="24" y="88" fill="#94a3b8" class="sans" font-size="11.5" font-style="italic">“Negative distance pulling interfaces into focus.”</text>
    <line x1="24" y1="104" x2="342" y2="104" stroke="#00e5ff" stroke-opacity="0.25"/>

    <!-- Skill Bars / Tags -->
    <g transform="translate(24, 122)">
