    <!-- Output Telemetry Bar -->
    <text x="24" y="278" fill="#d8b4fe" class="mono" font-size="10" letter-spacing="1.5">HOLLOW OUTPUT: 200%</text>
    <text x="342" y="278" text-anchor="end" fill="#f3e8ff" class="mono" font-size="10" font-weight="700">∞ LIMITLESS</text>
    <rect x="24" y="286" width="318" height="8" rx="4" fill="#120424"/>
    <rect x="24" y="286" width="318" height="8" rx="4" fill="#c084fc" class="pulse" filter="url(#glow)"/>
  </g>
</svg>
