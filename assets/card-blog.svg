<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1124"/>
      <stop offset="100%" stop-color="#06040e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="580" height="230" rx="12" fill="url(#bg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.45"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Header -->
  <text x="24" y="32" fill="#a5b4fc" class="mono" font-size="10" font-weight="700" letter-spacing="2">虚式「茈」 // HOLLOW: ANIME &amp; MANGA STREAMING ENGINE</text>
  <rect x="440" y="17" width="116" height="22" rx="11" fill="#131836" stroke="#818cf8" stroke-width="1"/>
  <text x="498" y="32" text-anchor="middle" fill="#c7d2fe" class="mono" font-size="9.5" font-weight="700">▶ HLS STREAM</text>

  <!-- Repo Title -->
  <text x="24" y="66" fill="#ffffff" class="sans" font-size="22" font-weight="800">✦ Blog (Lucid)</text>
  <text x="195" y="65" fill="#64748b" class="mono" font-size="11">Anime &amp; Manga Platform • HLS Proxy</text>

  <!-- Description -->
  <text x="24" y="96" fill="#cbd5e1" class="sans" font-size="13">Full-stack anime streaming &amp; manga discovery suite powered by</text>
  <text x="24" y="116" fill="#cbd5e1" class="sans" font-size="13">React 19, TanStack Router, custom HLS proxy &amp; AniList GraphQL.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 134)">
    <rect x="0" y="0" width="92" height="24" rx="6" fill="#10152e" stroke="#263166"/>
    <text x="46" y="16" text-anchor="middle" fill="#a5b4fc" class="mono" font-size="10.5">React 19</text>

    <rect x="102" y="0" width="102" height="24" rx="6" fill="#10152e" stroke="#263166"/>
    <text x="153" y="16" text-anchor="middle" fill="#a5b4fc" class="mono" font-size="10.5">TypeScript</text>

    <rect x="214" y="0" width="102" height="24" rx="6" fill="#10152e" stroke="#263166"/>
    <text x="265" y="16" text-anchor="middle" fill="#a5b4fc" class="mono" font-size="10.5">HLS.js Proxy</text>

    <rect x="326" y="0" width="116" height="24" rx="6" fill="#10152e" stroke="#263166"/>
    <text x="384" y="16" text-anchor="middle" fill="#a5b4fc" class="mono" font-size="10.5">PostgreSQL/PG</text>
  </g>

  <!-- Language Breakdown Bar -->
  <g transform="translate(24, 178)">
    <rect x="0" y="0" width="532" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="0" y="0" width="490" height="7" rx="3.5" fill="#facc15"/>
    <rect x="490" y="0" width="24" height="7" fill="#38bdf8"/>
    <rect x="514" y="0" width="18" height="7" rx="3.5" fill="#60a5fa"/>

    <circle cx="6" cy="22" r="4" fill="#facc15"/>
    <text x="16" y="26" fill="#94a3b8" class="mono" font-size="10.5">JavaScript 96.2%</text>

    <circle cx="148" cy="22" r="4" fill="#38bdf8"/>
    <text x="158" y="26" fill="#94a3b8" class="mono" font-size="10.5">TypeScript 2.2%</text>

    <circle cx="280" cy="22" r="4" fill="#60a5fa"/>
    <text x="290" y="26" fill="#94a3b8" class="mono" font-size="10.5">Python 1.3%</text>

    <text x="532" y="26" text-anchor="end" fill="#a5b4fc" class="mono" font-size="10.5" font-weight="700">OPEN REPOSITORY →</text>
  </g>
</svg>
